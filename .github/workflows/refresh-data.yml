name: Refresh stream data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run data pipeline
        run: python scripts/build_dataset.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stream-data.js data/stream-data.json data/sully-streams.csv data/exact-streams.csv
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "Auto-refresh stream data [$(date -u +%Y-%m-%dT%H:%MZ)]" &&
            git push
          )
