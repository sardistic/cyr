<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cyr.mom</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #090d10;
      color: #edf7f1;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .question {
      font-size: clamp(1.8rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.15;
      max-width: 18ch;
      margin-bottom: 2.5rem;
    }

    /* ── 8-Ball ── */
    .ball-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .ball8 {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%, rgba(255,255,255,.13) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 60%, #000 100%);
      box-shadow:
        0 24px 64px rgba(0,0,0,.95),
        0 8px 24px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -2px 4px rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform .15s ease;
      user-select: none;
    }
    .ball8:hover { transform: scale(1.025); }
    .ball8::after {
      content: '';
      position: absolute;
      top: 12%; left: 20%;
      width: 30%; height: 22%;
      background: radial-gradient(ellipse, rgba(255,255,255,.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .ball8.shaking { animation: shake8 .65s ease-in-out; }
    @keyframes shake8 {
      0%,100% { transform: rotate(0deg) translate(0,0); }
      12%     { transform: rotate(-9deg) translate(-7px,-3px); }
      25%     { transform: rotate(7deg)  translate(6px, 4px); }
      37%     { transform: rotate(-6deg) translate(-5px,-2px); }
      50%     { transform: rotate(5deg)  translate(4px, 3px); }
      62%     { transform: rotate(-3deg) translate(-3px,-1px); }
      75%     { transform: rotate(2deg)  translate(2px, 1px); }
      88%     { transform: rotate(-1deg) translate(-1px, 0); }
    }
    .ball8-num {
      position: absolute;
      top: 22px; left: 50%;
      transform: translateX(-50%);
      width: 34px; height: 34px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 900;
      color: #000;
      font-family: Georgia, serif;
      line-height: 1;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .ball8-window {
      width: 148px; height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, #1e3a9a 0%, #0c1a5a 45%, #04091e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-shadow:
        inset 0 3px 14px rgba(0,0,0,.7),
        inset 0 -1px 4px rgba(30,80,200,.15),
        0 0 0 1px rgba(0,0,60,.8);
      margin-top: 16px;
    }
    .ball8-answer {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(170,210,255,.97);
      line-height: 1.45;
      letter-spacing: .2px;
      opacity: 0;
      filter: blur(8px);
      transition: opacity 2s ease-in, filter 2s ease-in;
      pointer-events: none;
    }
    .ball8-answer.revealed { opacity: 1; filter: blur(0); }
    .ask-btn {
      padding: 11px 36px;
      background: #0e0e0e;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      color: rgba(255,255,255,.8);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
      cursor: pointer;
      transition: border-color .2s, color .2s, transform .1s;
      font-family: inherit;
    }
    .ask-btn:hover { border-color: rgba(255,255,255,.28); color: #fff; }
    .ask-btn:active { transform: scale(.97); }
    .ask-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .back {
      position: fixed;
      top: 1.25rem; left: 1.5rem;
      color: #2a383d;
      text-decoration: none;
      font-size: .85rem;
      letter-spacing: .06em;
      transition: color .2s;
    }
    .back:hover { color: #62d394; }
  </style>
</head>
<body>

  <a class="back" href="/">← forecast</a>

  <p class="question">Did cyr fuck my mom?</p>

  <div class="ball-wrap">
    <div class="ball8" id="ball8" onclick="shake8Ball()">
      <div class="ball8-num">8</div>
      <div class="ball8-window">
        <span class="ball8-answer" id="ball8-answer">ask me</span>
      </div>
    </div>
    <button class="ask-btn" id="ask-btn" onclick="shake8Ball()">Reveal the truth</button>
  </div>

  <script>
    const answers = [
      "Yes.",
      "It is certain.",
      "Without a doubt.",
      "Absolutely.",
      "Signs point to yes.",
      "He definitely did.",
      "Oh yeah.",
      "Confirmed.",
      "Affirmative.",
      "It is decidedly so.",
      "You may rely on it.",
      "As I see it, yes.",
      "Most likely.",
      "Outlook: yes.",
      "Yes — check her Twitch history.",
      "The data is conclusive.",
      "Ask your mom. She knows.",
      "She was Just Chatting... and then she wasn't.",
      "Yes, and she became his most loyal viewer.",
      "The council has confirmed it.",
      "She hasn't been the same since.",
      "He played a different kind of arc.",
      "The gap between visits: exactly 17.85 hours.",
      "Yes, and he got a follow out of it.",
      "Your father knows.",
      "He streamed that too.",
      "The model predicted this. The model is never wrong.",
      "Yes. She was the real Just Chatting stream.",
      "Confirmed by multiple sources.",
      "The 8-Ball has never been more certain.",
      "He called it a 'collab.'",
      "Yes. She rated it 10/10 peak viewers.",
      "Signs point to: obviously yes.",
      "Without question.",
      "Unambiguously yes.",
    ];

    let shaking = false;

    window.shake8Ball = function() {
      if (shaking) return;
      shaking = true;

      const ball   = document.getElementById('ball8');
      const answer = document.getElementById('ball8-answer');
      const btn    = document.getElementById('ask-btn');

      answer.classList.remove('revealed');
      answer.textContent = '';
      btn.disabled = true;

      ball.classList.remove('shaking');
      void ball.offsetWidth;
      ball.classList.add('shaking');

      setTimeout(() => {
        ball.classList.remove('shaking');
        const pick = answers[Math.floor(Math.random() * answers.length)];
        answer.textContent = pick;
        setTimeout(() => answer.classList.add('revealed'), 80);
        setTimeout(() => { btn.disabled = false; shaking = false; }, 2200);
      }, 750);
    };

    const initAnswer = document.getElementById('ball8-answer');
    initAnswer.textContent = 'ask me';
    initAnswer.style.opacity = '0.35';
    initAnswer.style.filter = 'none';
    initAnswer.style.fontSize = '12px';
    initAnswer.style.color = 'rgba(120,160,220,.7)';
  </script>

</body>
</html>
